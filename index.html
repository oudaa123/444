<button id="addAdminBtn" style="position:fixed; bottom:10px; left:10px; background:green; color:white; padding:10px 15px; border-radius:50px; font-size:12px; z-index:9999; font-weight:bold;">
    👑 إضافة حساب المدير
</button>

<script>
document.getElementById('addAdminBtn')?.addEventListener('click', async () => {
    try {
        const adminPhone = "01022495795";
        const adminPassword = "010065";
        
        // إضافة حساب المدير
        await firebase.database().ref(`users/${adminPhone}`).set({
            name: "المدير العام",
            storeName: "مملكة التجار",
            password: adminPassword,
            clientWord: "admin@123",
            active: true,
            isAdmin: true,
            createdAt: Date.now()
        });
        
        alert(`✅ تم إضافة حساب المدير بنجاح!\n\n📱 الرقم: ${adminPhone}\n🔑 كلمة السر: ${adminPassword}\n\nيمكنك الآن تسجيل الدخول`);
        
        // تعبئة حقول تسجيل الدخول تلقائياً
        document.getElementById('loginPhone').value = adminPhone;
        document.getElementById('loginPassword').value = adminPassword;
        
        // إخفاء الزر بعد الإضافة (اختياري)
        document.getElementById('addAdminBtn').style.display = 'none';
        
    } catch(e) {
        alert("❌ خطأ: " + e.message);
    }
});
</script>
