<button id="showMyPassword" style="position:fixed; bottom:10px; left:10px; background:orange; color:white; padding:8px 12px; border-radius:50px; font-size:12px; z-index:9999;">
    🔑 اعرض كلمة سري
</button>

<script>
document.getElementById('showMyPassword')?.addEventListener('click', async () => {
    try {
        const snapshot = await firebase.database().ref('users/01022495795').once('value');
        const user = snapshot.val();
        if(user) {
            alert(`📱 رقمك: 01022495795\n🔑 كلمة السر: ${user.password}\n👤 اسمك: ${user.name}`);
        } else {
            alert("❌ لا يوجد حساب بهذا الرقم");
        }
    } catch(e) {
        alert("خطأ: " + e.message);
    }
});
</script>
